# The front door: one address for shoppers, staff and partners, as a load balancer would be in front of Cairnmoor.
# Logs go to stdout in HAProxy's HTTP format. Its metrics are on :8404 inside the lab network, for Prometheus;
# the load balancer guide (guide 9) adds its health views.
global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    option forwardfor if-none
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend metrics
    bind :8404
    no log
    http-request use-service prometheus-exporter if { path /metrics }
    http-request return status 404

frontend shop
    bind :8080
    acl is_search path_beg /search
    acl is_signin path_beg /signin
    acl is_wholesale path_beg /wholesale/
    acl is_help path_beg /help/
    acl is_supplier path_beg /supplier/
    use_backend search if is_search
    use_backend accounts if is_signin
    use_backend wholesale if is_wholesale
    use_backend service if is_help
    use_backend supply if is_supplier
    default_backend orders

backend orders
    server orders orders:8000 check inter 10s

backend search
    server search search:8000 check inter 10s

backend accounts
    server accounts accounts:8000 check inter 10s

backend wholesale
    http-request replace-path ^/wholesale(/.*) \1
    server wholesale wholesale:8000 check inter 10s

backend service
    http-request replace-path ^/help(/.*) \1
    server service service:8000 check inter 10s

backend supply
    http-request replace-path ^/supplier(/.*) \1
    server supply supply:8000 check inter 10s
