# The lab, step 1 (guide 0): Cairnmoor's estate and its traffic, plus a starter dashboard (Prometheus and Grafana).
# Later guides add the edge sensors and the rest of the observe zone.
# Every stub is the same image (stub/), told which service it is by SERVICE and what that service does by estate.json.
# Set CLOCK_SPEED (Cairnmoor hours per real hour, default 24), PEAK=1, LAB_PORT (default 18080) and GRAFANA_PORT
# (default 13000) in a .env file or on the command line.
name: cairnmoor

x-stub: &stub
  build: ./stub
  image: cairnmoor-stub:step1
  restart: unless-stopped
  networks: [estate]
  volumes: ["./estate.json:/estate.json:ro"]
  mem_limit: 64m

services:
  orders:
    <<: *stub
    environment:
      SERVICE: orders
      CLOCK_SPEED: ${CLOCK_SPEED:-24}
      PEAK: ${PEAK:-0}
  search:
    <<: *stub
    environment:
      SERVICE: search
      CLOCK_SPEED: ${CLOCK_SPEED:-24}
      PEAK: ${PEAK:-0}
  accounts:
    <<: *stub
    environment:
      SERVICE: accounts
      CLOCK_SPEED: ${CLOCK_SPEED:-24}
      PEAK: ${PEAK:-0}
  stores:
    <<: *stub
    environment:
      SERVICE: stores
      CLOCK_SPEED: ${CLOCK_SPEED:-24}
      PEAK: ${PEAK:-0}
  shop-perth:
    <<: *stub
    environment:
      SERVICE: shop-perth
      CLOCK_SPEED: ${CLOCK_SPEED:-24}
      PEAK: ${PEAK:-0}
  shop-inverness:
    <<: *stub
    environment:
      SERVICE: shop-inverness
      CLOCK_SPEED: ${CLOCK_SPEED:-24}
      PEAK: ${PEAK:-0}
  shop-york:
    <<: *stub
    environment:
      SERVICE: shop-york
      CLOCK_SPEED: ${CLOCK_SPEED:-24}
      PEAK: ${PEAK:-0}
  warehouse:
    <<: *stub
    environment:
      SERVICE: warehouse
      CLOCK_SPEED: ${CLOCK_SPEED:-24}
      PEAK: ${PEAK:-0}
  wholesale:
    <<: *stub
    environment:
      SERVICE: wholesale
      CLOCK_SPEED: ${CLOCK_SPEED:-24}
      PEAK: ${PEAK:-0}
  supply:
    <<: *stub
    environment:
      SERVICE: supply
      CLOCK_SPEED: ${CLOCK_SPEED:-24}
      PEAK: ${PEAK:-0}
  service:
    <<: *stub
    environment:
      SERVICE: service
      CLOCK_SPEED: ${CLOCK_SPEED:-24}
      PEAK: ${PEAK:-0}
  payments:
    <<: *stub
    environment:
      SERVICE: payments
      CLOCK_SPEED: ${CLOCK_SPEED:-24}
      PEAK: ${PEAK:-0}
  fraud:
    <<: *stub
    environment:
      SERVICE: fraud
      CLOCK_SPEED: ${CLOCK_SPEED:-24}
      PEAK: ${PEAK:-0}
  couriers:
    <<: *stub
    environment:
      SERVICE: couriers
      CLOCK_SPEED: ${CLOCK_SPEED:-24}
      PEAK: ${PEAK:-0}
  brands:
    <<: *stub
    environment:
      SERVICE: brands
      CLOCK_SPEED: ${CLOCK_SPEED:-24}
      PEAK: ${PEAK:-0}

  edge:
    image: haproxy:3.0-alpine
    restart: unless-stopped
    networks: [estate]
    ports: ["127.0.0.1:${LAB_PORT:-18080}:8080"]
    volumes: ["./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"]
    depends_on: [orders, search, accounts, wholesale, service, supply]

  shoppers:
    image: grafana/k6:0.54.0
    restart: unless-stopped
    networks: [estate]
    command: ["run", "--quiet", "--no-summary", "/traffic/shopper.js"]
    environment:
      CLOCK_SPEED: ${CLOCK_SPEED:-24}
      PEAK: ${PEAK:-0}
      SHOPPERS: ${SHOPPERS:-20}
    volumes: ["./traffic:/traffic:ro", "./estate.json:/estate.json:ro"]
    depends_on: [edge]

  # The observe zone, starting small: Prometheus reads every service's metrics, Grafana shows them.
  prometheus:
    image: prom/prometheus:v3.0.1
    restart: unless-stopped
    networks: [estate]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes: ["./observe/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus:/prometheus"]
    mem_limit: 256m

  grafana:
    image: grafana/grafana-oss:11.3.0
    restart: unless-stopped
    networks: [estate]
    ports: ["127.0.0.1:${GRAFANA_PORT:-13000}:3000"]
    environment:
      # Anyone on this computer can view the dashboards without signing in; sign in as admin/admin to edit.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cairnmoor.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./observe/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observe/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    mem_limit: 256m
    depends_on: [prometheus]

networks:
  estate: {}

volumes:
  prometheus: {}
  grafana: {}
