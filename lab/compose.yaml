# The lab, step 1 (guide 0): Cairnmoor's estate and its traffic. Later guides add the edge and observe zones.
# Every stub is the same image (stub/), told which service it is by SERVICE and what that service does by estate.json.
# Set CLOCK_SPEED (Cairnmoor hours per real hour, default 24) and PEAK=1 in a .env file or on the command line.
name: cairnmoor

x-stub: &stub
  build: ./stub
  image: cairnmoor-stub:step1
  restart: unless-stopped
  networks: [estate]
  volumes: ["./estate.json:/estate.json:ro"]
  mem_limit: 64m

services:
  orders:
    <<: *stub
    environment:
      SERVICE: orders
      CLOCK_SPEED: ${CLOCK_SPEED:-24}
      PEAK: ${PEAK:-0}
  search:
    <<: *stub
    environment:
      SERVICE: search
      CLOCK_SPEED: ${CLOCK_SPEED:-24}
      PEAK: ${PEAK:-0}
  accounts:
    <<: *stub
    environment:
      SERVICE: accounts
      CLOCK_SPEED: ${CLOCK_SPEED:-24}
      PEAK: ${PEAK:-0}
  stores:
    <<: *stub
    environment:
      SERVICE: stores
      CLOCK_SPEED: ${CLOCK_SPEED:-24}
      PEAK: ${PEAK:-0}
  shop-perth:
    <<: *stub
    environment:
      SERVICE: shop-perth
      CLOCK_SPEED: ${CLOCK_SPEED:-24}
      PEAK: ${PEAK:-0}
  shop-inverness:
    <<: *stub
    environment:
      SERVICE: shop-inverness
      CLOCK_SPEED: ${CLOCK_SPEED:-24}
      PEAK: ${PEAK:-0}
  shop-york:
    <<: *stub
    environment:
      SERVICE: shop-york
      CLOCK_SPEED: ${CLOCK_SPEED:-24}
      PEAK: ${PEAK:-0}
  warehouse:
    <<: *stub
    environment:
      SERVICE: warehouse
      CLOCK_SPEED: ${CLOCK_SPEED:-24}
      PEAK: ${PEAK:-0}
  wholesale:
    <<: *stub
    environment:
      SERVICE: wholesale
      CLOCK_SPEED: ${CLOCK_SPEED:-24}
      PEAK: ${PEAK:-0}
  supply:
    <<: *stub
    environment:
      SERVICE: supply
      CLOCK_SPEED: ${CLOCK_SPEED:-24}
      PEAK: ${PEAK:-0}
  service:
    <<: *stub
    environment:
      SERVICE: service
      CLOCK_SPEED: ${CLOCK_SPEED:-24}
      PEAK: ${PEAK:-0}
  payments:
    <<: *stub
    environment:
      SERVICE: payments
      CLOCK_SPEED: ${CLOCK_SPEED:-24}
      PEAK: ${PEAK:-0}
  fraud:
    <<: *stub
    environment:
      SERVICE: fraud
      CLOCK_SPEED: ${CLOCK_SPEED:-24}
      PEAK: ${PEAK:-0}
  couriers:
    <<: *stub
    environment:
      SERVICE: couriers
      CLOCK_SPEED: ${CLOCK_SPEED:-24}
      PEAK: ${PEAK:-0}
  brands:
    <<: *stub
    environment:
      SERVICE: brands
      CLOCK_SPEED: ${CLOCK_SPEED:-24}
      PEAK: ${PEAK:-0}

  edge:
    image: haproxy:3.0-alpine
    restart: unless-stopped
    networks: [estate]
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"]
    depends_on: [orders, search, accounts, wholesale, service, supply]

  shoppers:
    image: grafana/k6:0.54.0
    restart: unless-stopped
    networks: [estate]
    command: ["run", "--quiet", "--no-summary", "/traffic/shopper.js"]
    environment:
      CLOCK_SPEED: ${CLOCK_SPEED:-24}
      PEAK: ${PEAK:-0}
      SHOPPERS: ${SHOPPERS:-20}
    volumes: ["./traffic:/traffic:ro", "./estate.json:/estate.json:ro"]
    depends_on: [edge]

networks:
  estate: {}
