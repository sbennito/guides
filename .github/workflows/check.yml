name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build.mjs --check
      - run: docker compose -f lab/compose.yaml config -q
      - run: python3 -m py_compile lab/stub/stub.py
